services:
  postgres:
    image: postgres:16-alpine
    container_name: slotio-worldcup-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: slotio
      POSTGRES_PASSWORD: slotio
      POSTGRES_DB: slotio_worldcup
    ports:
      - "5432:5432"
    volumes:
      - slotio_pg_data:/var/lib/postgresql/data

volumes:
  slotio_pg_data:
